name: 构建中文版 KCC

# 在 GitHub 云端产出中文版 KCC 可执行文件，本机不装 Python / PySide6 / PyInstaller。
# 用法：Actions → 构建中文版 KCC → Run workflow

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "构建目标"
        required: true
        type: choice
        default: "windows,linux"
        options:
          - "windows,linux"
          - "windows"
          - "linux"
      release_tag:
        description: "填了就建 Release 并挂上可执行文件（例如 v11.3.2-zh）；留空只出 Artifacts"
        required: false
        default: ""
  push:
    branches: [master]
    paths:
      - "i18n/**"
      - "kindlecomicconverter/i18n.py"
      - ".github/workflows/build-zh.yml"
      - ".github/scripts/verify_zh.py"

permissions:
  contents: write

# 依赖直接读仓库自带的 requirements.txt（上游自己的清单），不另维护一份

jobs:
  # ------------------------------------------------------------------
  # 第一步：翻译链路自检。不通过就不浪费时间去打包。
  # ------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装 Qt 运行库
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libfreetype6

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt certifi

      - name: 编译翻译文件 (.ts -> .qm)
        run: |
          pyside6-lrelease i18n/kcc_zh_CN.ts -qm i18n/kcc_zh_CN.qm
          ls -l i18n/

      - name: 准备 Qt 自带翻译（qtbase 中文目录）
        shell: bash
        run: bash .github/scripts/fetch_qtbase.sh

      - name: 自检 A —— 文件系统回退路径
        run: python .github/scripts/verify_zh.py

      - name: 重建 Qt 资源 (.qrc -> KCC_rc.py)，把 .qm 打进资源系统
        run: |
          pyside6-rcc gui/KCC.qrc -o kindlecomicconverter/KCC_rc.py
          ls -l kindlecomicconverter/KCC_rc.py

      - name: 自检 B —— 资源系统路径（打包后走这条）
        run: |
          find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          python .github/scripts/verify_zh.py --require-resource

      - name: 上传翻译产物
        uses: actions/upload-artifact@v4
        with:
          name: zh-translations
          path: |
            i18n/kcc_zh_CN.ts
            i18n/kcc_zh_CN.qm
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 第二步：Windows 无签名 exe（上游走 SignPath 签名，fork 上没有密钥）
  # ------------------------------------------------------------------
  windows:
    needs: verify
    if: contains(inputs.platforms || 'windows,linux', 'windows')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt certifi pyinstaller

      - name: 编译翻译文件并准备 qtbase 中文目录
        shell: bash
        run: |
          pyside6-lrelease i18n/kcc_zh_CN.ts -qm i18n/kcc_zh_CN.qm
          bash .github/scripts/fetch_qtbase.sh

      - name: 重建 Qt 资源 (.qrc -> KCC_rc.py)
        shell: pwsh
        run: |
          Get-ChildItem i18n | Format-Table Name, Length
          pyside6-rcc gui/KCC.qrc -o kindlecomicconverter/KCC_rc.py

      - name: 打包 exe
        shell: pwsh
        run: |
          $v = python -c "import kindlecomicconverter as k; print(k.__version__)"
          Write-Host "KCC version: $v"
          pyinstaller --hidden-import=_cffi_backend -y -F --noupx -w `
            -i icons/comic2ebook.ico -n "KCC_zh_win64_$v" kcc.py
          pyinstaller --hidden-import=_cffi_backend -y -F --noupx `
            -i icons/comic2ebook.ico -n "kcc-c2e_zh_win64_$v" kcc-c2e.py
          Get-ChildItem dist | Format-Table Name, Length

      - name: 上传 exe
        uses: actions/upload-artifact@v4
        with:
          name: kcc-zh-windows
          path: dist/*.exe
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 第三步：Linux 单文件可执行程序
  # ------------------------------------------------------------------
  linux:
    needs: verify
    if: contains(inputs.platforms || 'windows,linux', 'linux')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libfreetype6
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt certifi pyinstaller

      - name: 编译翻译文件并重建资源
        run: |
          pyside6-lrelease i18n/kcc_zh_CN.ts -qm i18n/kcc_zh_CN.qm
          bash .github/scripts/fetch_qtbase.sh
          pyside6-rcc gui/KCC.qrc -o kindlecomicconverter/KCC_rc.py

      - name: 打包可执行程序
        run: |
          V=$(python -c "import kindlecomicconverter as k; print(k.__version__)")
          echo "KCC version: $V"
          pyinstaller --hidden-import=_cffi_backend --hidden-import=queue -y -F \
            -i icons/comic2ebook.ico -n "kcc_zh_linux_$V" kcc.py
          pyinstaller --hidden-import=_cffi_backend --hidden-import=queue -y -F \
            -i icons/comic2ebook.ico -n "kcc-c2e_zh_linux_$V" kcc-c2e.py
          ls -lh dist/

      - name: 冒烟测试 —— 确认翻译已进资源系统
        run: |
          find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          python .github/scripts/verify_zh.py --require-resource

      - name: 冒烟测试 —— 真跑打包后的程序，确认冻结包内依赖与翻译资源完整
        continue-on-error: true
        run: |
          BIN=$(ls dist/kcc_zh_linux_* | head -1)
          echo "运行 $BIN （offscreen，25 秒后终止）"
          set +e
          QT_QPA_PLATFORM=offscreen timeout 25 "$BIN" > /tmp/smoke.log 2>&1
          CODE=$?
          set -e
          echo "退出码: $CODE （124 = 被 timeout 终止，说明程序正常跑起来了）"
          cat /tmp/smoke.log || true
          if [ "$CODE" = "124" ]; then
            echo "OK: 程序启动后持续运行，冻结包内依赖与资源完整"
          else
            echo "::warning::程序提前退出，退出码 $CODE，请检查上面的日志"
          fi

      - name: 上传可执行程序
        uses: actions/upload-artifact@v4
        with:
          name: kcc-zh-linux
          path: dist/*
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 第四步：发布到 Release（仅当填了 release_tag）
  # 在云端下载 artifacts 再上传，本机不参与
  # ------------------------------------------------------------------
  release:
    needs: [verify, windows, linux]
    if: always() && inputs.release_tag != '' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: rel

      - name: 发布到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 本 job 没有 checkout，gh 无法推断仓库，用 Actions 自带的 GITHUB_REPOSITORY 指定
          export GH_REPO="$GITHUB_REPOSITORY"
          TAG="${{ inputs.release_tag }}"
          mkdir -p upload
          # 去掉 artifact 名那一层目录，统一摊到 upload/
          find rel -type f \( -name '*.exe' -o -name 'kcc_zh_linux_*' -o -name 'kcc-c2e_zh_linux_*' \) \
            -exec cp {} upload/ \;
          ls -lh upload/

          cat > notes.md <<'NOTES'
          KCC（Kindle Comic Converter）**简体中文版**，在上游基础上做了界面中文化。

          ## 下载哪个

          | 文件 | 说明 |
          |---|---|
          | `KCC_zh_win64_*.exe` | Windows 图形界面 |
          | `kcc-c2e_zh_win64_*.exe` | Windows 命令行 |
          | `kcc_zh_linux_*` | Linux 图形界面（单文件） |
          | `kcc-c2e_zh_linux_*` | Linux 命令行（单文件） |

          ## 注意

          - **Windows 版未签名**，首次运行会弹 SmartScreen 警告，点「更多信息」→「仍要运行」。
          - **Linux 版**需要系统有 Qt 运行库：`libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3`。
          - 命令行程序（kcc-c2e）的输出提示仍为英文，本次只做了图形界面中文化。

          ## 中文化范围

          - 控件层 128 条：按钮 / 标签 / 菜单 / 提示
          - 运行时消息 60 条：任务列表 / 对话框 / 托盘通知 / 进度条

          机制与改翻译的方法见仓库 `.github/KCC-ZH.md`。
          NOTES

          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "KCC 中文版 $TAG" --notes-file notes.md
          gh release upload "$TAG" upload/* --clobber
          echo "已发布: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
