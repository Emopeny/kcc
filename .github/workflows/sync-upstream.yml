name: 跟随上游自动中文化

# 上游 ciromattia/kcc 更新后，自动把改动合进本 fork，
# 验证中文化仍然成立，然后触发中文版重新构建并发布 Release。
#
# 全部在 GitHub 云端完成，本机不参与。
#
# 判断"上游是否有更新"用的是 git 祖先关系，不需要额外存状态文件：
# 如果 upstream/master 是 HEAD 的祖先，说明已经合过；否则就是有新提交。

on:
  schedule:
    # 每天 UTC 19:00 = 北京时间 03:00
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "即使上游无更新也触发一次重建（手动刷新 Release 用）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: 检出 fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 配置 git 身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 拉取上游并判断是否有更新
        id: check
        run: |
          set -euo pipefail
          git checkout -B master origin/master
          git remote add upstream https://github.com/ciromattia/kcc.git 2>/dev/null || true
          git fetch upstream master:refs/remotes/upstream/master --no-tags

          echo "上游 HEAD   : $(git rev-parse --short upstream/master)"
          echo "本 fork HEAD: $(git rev-parse --short HEAD)"

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "::notice::上游没有新提交，跳过"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::上游有新提交，开始合并"
            # 合并冲突会在这里直接失败，不会带着坏结果往下走
            git merge upstream/master --no-edit
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          VER=$(grep -oP "__version__\s*=\s*['\"]\K[^'\"]+" kindlecomicconverter/__init__.py | head -1)
          echo "KCC 版本: $VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: 安装 Qt 运行库
        if: steps.check.outputs.changed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libfreetype6

      - name: 安装依赖
        if: steps.check.outputs.changed == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt certifi

      - name: 编译翻译文件
        if: steps.check.outputs.changed == 'true'
        run: pyside6-lrelease i18n/kcc_zh_CN.ts -qm i18n/kcc_zh_CN.qm

      - name: 中文化自检 —— 不过就不推送
        if: steps.check.outputs.changed == 'true'
        run: python .github/scripts/verify_zh.py

      - name: 推送合并结果
        if: steps.check.outputs.changed == 'true'
        run: |
          git push origin master
          echo "已推送合并结果，HEAD: $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || inputs.force == true
    runs-on: ubuntu-latest
    steps:
      - name: 触发中文版构建并发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 本 job 没有 checkout，gh 无法推断仓库
          export GH_REPO="$GITHUB_REPOSITORY"
          TAG="v${{ needs.sync.outputs.version }}-zh"
          if [ "${{ needs.sync.outputs.changed }}" = "true" ]; then
            echo "上游已更新，触发中文版构建；Release tag: $TAG"
          else
            echo "上游无更新，这是手动强制重建；Release tag: $TAG"
          fi
          gh workflow run build-zh.yml -f platforms=windows,linux -f release_tag="$TAG"
          sleep 20
          gh run list --workflow=build-zh.yml --limit 3
          {
            echo "## 跟随上游完成"
            echo
            echo "- 上游已合并，中文化自检通过"
            echo "- 已触发中文版构建，Release tag: \`$TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
