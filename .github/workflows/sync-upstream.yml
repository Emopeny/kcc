name: 跟随上游自动中文化

# 上游 ciromattia/kcc 更新后，自动把改动合进本 fork，
# 验证中文化仍然成立，然后触发中文版重新构建并发布 Release。
#
# 全部在 GitHub 云端完成，本机不参与。
#
# 判断"上游是否有更新"用的是 git 祖先关系，不需要额外存状态文件：
# 如果 upstream/master 是 HEAD 的祖先，说明已经合过；否则就是有新提交。
#
# 冲突消解：本 fork 自己动过的文件（README.md、gui/KCC.qrc）和上游撞行是常态，
# 裸 merge 会每天卡死。所以合并走 .github/scripts/merge_upstream.sh，
# 按白名单自动消解；白名单外的冲突才失败并列出 diff 等人处理。
#
# 推送令牌：GITHUB_TOKEN 是 GitHub App 令牌，改 .github/workflows/** 的提交必被拒
# （refusing to allow a GitHub App to create or update workflow ... without workflows permission；
#  permissions 块里压根没有 workflows 这个键，留 ref 判定，改分支也一样拒）。
# 所以推送用 secret SYNC_PUSH_TOKEN —— 需带 workflow 权限的令牌：
#   经典 PAT 勾 workflow scope；或细粒度 PAT 给 Contents: Read/Write + Workflows: Read/Write（仅此仓库）。
# 上游改的工作流文件因此能一起自动跟进（WORKFLOWS_POLICY=theirs）。
# 换令牌：gh secret set SYNC_PUSH_TOKEN -R Emopeny/kcc （值从 stdin 读，别写进命令行）

on:
  schedule:
    # 每天 UTC 19:00 = 北京时间 03:00
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "完整预演整条链路（含中文化自检）并触发重建；上游无更新时不推送合并"
        required: false
        type: boolean
        default: false
      sync_workflows:
        description: "把 .github/workflows 下的上游文件强制拉成上游当前版本并推送（补历史漏跟的改动）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: 校验推送令牌
        env:
          SYNC_PUSH_TOKEN: ${{ secrets.SYNC_PUSH_TOKEN }}
        run: |
          if [ -z "${SYNC_PUSH_TOKEN:-}" ]; then
            echo "::error::缺 secret SYNC_PUSH_TOKEN。上游改工作流文件时，用 GITHUB_TOKEN 推送必被拒；"
            echo "::error::请先 gh secret set SYNC_PUSH_TOKEN -R $GITHUB_REPOSITORY（带 workflow 权限的令牌）。"
            exit 1
          fi
          echo "推送令牌已配置（长度 ${#SYNC_PUSH_TOKEN}）"

      - name: 检出 fork（用带 workflow 权限的令牌，否则推不动工作流文件）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PUSH_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 配置 git 身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 拉取上游并判断是否有更新
        id: check
        env:
          WORKFLOWS_POLICY: theirs
        run: |
          set -euo pipefail
          git checkout -B master origin/master
          git remote add upstream https://github.com/ciromattia/kcc.git 2>/dev/null || true
          git fetch upstream master:refs/remotes/upstream/master --no-tags

          echo "上游 HEAD   : $(git rev-parse --short upstream/master)"
          echo "本 fork HEAD: $(git rev-parse --short HEAD)"

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "::notice::上游没有新提交，跳过"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::上游有新提交，开始合并"
            # 冲突按白名单自动消解（README.md 跟上游、gui/KCC.qrc 两边合并、
            # .github/workflows 跟上游）；白名单外的冲突会直接失败，不带坏结果往下走。
            bash .github/scripts/merge_upstream.sh upstream/master
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          VER=$(grep -oP "__version__\s*=\s*['\"]\K[^'\"]+" kindlecomicconverter/__init__.py | head -1)
          echo "KCC 版本: $VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: 安装 Qt 运行库
        if: steps.check.outputs.changed == 'true' || inputs.force == true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libfreetype6

      - name: 安装依赖
        if: steps.check.outputs.changed == 'true' || inputs.force == true
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt certifi

      - name: 编译翻译文件并准备 qtbase 中文目录
        if: steps.check.outputs.changed == 'true' || inputs.force == true
        run: |
          pyside6-lrelease i18n/kcc_zh_CN.ts -qm i18n/kcc_zh_CN.qm
          bash .github/scripts/fetch_qtbase.sh

      - name: 中文化自检 —— 不过就不推送
        if: steps.check.outputs.changed == 'true' || inputs.force == true
        run: python .github/scripts/verify_zh.py

      - name: 把上游的工作流文件同步过来（手动触发时）
        if: inputs.sync_workflows == true
        run: |
          set -euo pipefail
          # 只覆盖上游存在的那几个文件；本 fork 自己的 build-zh.yml / convert.yml /
          # sync-upstream.yml 上游没有，不受影响
          git checkout upstream/master -- .github/workflows
          if git diff --cached --quiet; then
            echo "::notice::上游工作流文件与本 fork 一致，无需同步"
          else
            git diff --cached --stat
            git commit -m "chore(ci): 同步上游工作流文件到 $(git rev-parse --short upstream/master)"
            echo "::notice::已按上游版本更新工作流文件"
          fi

      - name: 推送合并结果
        if: steps.check.outputs.changed == 'true' || inputs.sync_workflows == true
        run: |
          set -euo pipefail
          git push origin master
          HEAD_SHORT=$(git rev-parse --short HEAD)
          echo "已推送，HEAD: $HEAD_SHORT" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::已推送到 master，HEAD: $HEAD_SHORT"

  build:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || inputs.force == true
    runs-on: ubuntu-latest
    steps:
      - name: 触发中文版构建并发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 本 job 没有 checkout，gh 无法推断仓库
          export GH_REPO="$GITHUB_REPOSITORY"
          TAG="v${{ needs.sync.outputs.version }}-zh"
          if [ "${{ needs.sync.outputs.changed }}" = "true" ]; then
            echo "上游已更新，触发中文版构建；Release tag: $TAG"
          else
            echo "上游无更新，这是手动强制重建；Release tag: $TAG"
          fi
          gh workflow run build-zh.yml -f platforms=windows,linux -f release_tag="$TAG"
          sleep 20
          gh run list --workflow=build-zh.yml --limit 3
          {
            echo "## 跟随上游完成"
            echo
            echo "- 上游已合并，中文化自检通过"
            echo "- 已触发中文版构建，Release tag: \`$TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
